version: 2

project_name: kropka

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - main: ./cmd/kropka
    binary: kropka
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [README.md, LICENSE]

checksum:
  name_template: checksums.txt

# One SPDX SBOM per archive, made by syft.
sboms:
  - artifacts: archive

# Keyless: cosign gets a short-lived certificate for the release workflow's
# OIDC identity from Sigstore, so there is no key to keep. Signing the
# checksums covers every archive and SBOM listed in them.
signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args: ["sign-blob", "--bundle=${signature}", "${artifact}", "--yes"]
    artifacts: checksum

docker_signs:
  - args: ["sign", "${artifact}@${digest}", "--yes"]

dockers_v2:
  - images:
      - "ghcr.io/{{ .Env.GITHUB_REPOSITORY_OWNER }}/kropka"
    tags:
      - "{{ .Version }}"
      - latest
    dockerfile: Dockerfile.release
    platforms: [linux/amd64, linux/arm64]
    labels:
      org.opencontainers.image.source: "{{ .GitURL }}"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.description: "Serve . to your phone in one command"

homebrew_casks:
  - repository:
      owner: "{{ .Env.GITHUB_REPOSITORY_OWNER }}"
      name: homebrew-tap
      # The release job's GITHUB_TOKEN can only write to this repo.
      token: "{{ .Env.PACKAGE_REPOS_TOKEN }}"
    homepage: https://github.com/tkabala/kropka
    description: "Serve . to your phone in one command"
    skip_upload: auto
    hooks:
      post:
        # The binary isn't signed or notarized, so without this Gatekeeper
        # refuses to run it.
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/kropka"]
          end

scoops:
  - repository:
      owner: "{{ .Env.GITHUB_REPOSITORY_OWNER }}"
      name: scoop-bucket
      # Same fine-grained PAT as the tap.
      token: "{{ .Env.PACKAGE_REPOS_TOKEN }}"
    homepage: https://github.com/tkabala/kropka
    description: "Serve . to your phone in one command"
    license: MIT
    skip_upload: auto

changelog:
  sort: asc
  filters:
    # Any case, scoped or not; a breaking change ("chore!:") still shows.
    exclude: ['(?i)^(docs|test|chore)(\([^)]*\))?:']
